[project]
name = "actvibsoftware"
version = "0.9.1"
description = "Monitoring and active control of laboratory vibration experiments"
readme = "README.md"
authors = [{ name = "Eduardo Batista" }]
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["active vibration control", "data acquisition", "ESP32", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "esptool==5.1.0",
    "numpy==2.3.0",
    "pandas==2.3.0",
    "pyarrow==20.0.0",
    "pyqtdarktheme==2.1.0",
    "pyqtgraph==0.13.7",
    "pyserial==3.5",
    "pyside6-essentials==6.9.0",
    "scipy==1.15.3",
]

[project.urls]
Homepage = "https://github.com/eduardobatista/ActVibSoftware"
Repository = "https://github.com/eduardobatista/ActVibSoftware"
Issues = "https://github.com/eduardobatista/ActVibSoftware/issues"
Firmware = "https://github.com/eduardobatista/ActVibFirmware"

[project.gui-scripts]
actvib = "ActVib.__main__:main"

[dependency-groups]
# Only used to build the Windows installer/portable ZIP (see installer/).
# Not part of the published wheel/sdist dependencies.
packaging = [
    "pyinstaller==6.22.0",
    "pyinstaller-hooks-contrib>=2025.8",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ActVib"
module-root = ""
