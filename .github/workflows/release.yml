name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag must be v$version (got $GITHUB_REF_NAME)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-python:
    needs: metadata
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.5"
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libdbus-1-3 libegl1 libfontconfig1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Build distributions
        run: uv build --clear
      - name: Test wheel in a clean environment
        run: uv run --locked python scripts/check_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  build-windows-x64:
    needs: metadata
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.5"
      - name: Build ActVib and ActVibFlash, package installer and portable ZIP
        shell: pwsh
        run: ./installer/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: installer/output/*
          if-no-files-found: error

  github-release:
    needs: [build-python, build-windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-release
          path: release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  deploy-index:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Build package index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_simple_index.py --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy package index
        id: deployment
        uses: actions/deploy-pages@v4
